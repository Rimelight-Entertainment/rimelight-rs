# ffmpeg-sys-next 9.1.1 with its bindings checked in (CV-V.2, decision 0046). Replaces the crates.io package through
# `[patch.crates-io]` in the workspace Cargo.toml, so no developer machine or CI runner needs clang (bindgen) or the
# FFmpeg headers. `src/` is upstream's, unchanged; `build.rs` is ours (see its doc comment). Upstream licence: WTFPL.
# Not a workspace member (it is in `workspace.exclude`), so the generated bindings are not linted.
[package]
name = "ffmpeg-sys-next"
version = "9.1.1"
edition = "2024"
links = "ffmpeg"
build = "build.rs"
description = "FFI bindings to FFmpeg (ffmpeg-sys-next 9.1.1 with committed bindings)"
license = "WTFPL"
publish = false

[lib]
name = "ffmpeg_sys_next"
path = "src/lib.rs"
doctest = false

[dependencies]
libc = "0.2"

# The features upstream has, so `ffmpeg-next` resolves against this crate. Only the library features mean anything
# here; the `build*` features (building FFmpeg from source) are not supported.
[features]
default = ["avcodec", "avdevice", "avfilter", "avformat", "swresample", "swscale"]
avcodec = []
avdevice = ["avformat"]
avfilter = []
avformat = ["avcodec"]
avresample = []
postproc = []
swresample = []
swscale = []
static = []
build = ["static"]
non-exhaustive-enums = []
