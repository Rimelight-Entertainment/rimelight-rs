[package]
name = "webview_spike"
version.workspace = true
edition.workspace = true

[dependencies]
slint = { workspace = true }
raw-window-handle = { workspace = true }

[target.'cfg(windows)'.dependencies]
wry = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlIFrameElement", "CssStyleDeclaration", "Node"] }
wasm-bindgen = "0.2"

[build-dependencies]
slint-build = { workspace = true }
