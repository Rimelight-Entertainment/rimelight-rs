# CMS.0 spikes (Space decision 0049). Its own workspace: excluded from rimelight-rs by `spikes/*`.
[workspace]
resolver = "3"
members = ["crates/webview_spike", "crates/richtext_spike", "crates/crdt_spike"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
slint = { version = "=1.18.1", features = ["raw-window-handle-06"] }
slint-build = "=1.18.1"
raw-window-handle = "0.6"
parley = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Versions picked at the final build (spike only); the lock file records what was used.
wry = "*"
yrs = "*"
loro = "*"

# Keep the build small: no debug info for dependencies (disk is tight).
[profile.dev]
debug = 1
[profile.dev.package."*"]
debug = 0
