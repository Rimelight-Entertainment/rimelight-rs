[package]
name = "rimelight_media"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "Video and audio: probe, poster frames, and a player with sound, subtitles, speed and trimming (FFmpeg and cpal on Windows)"

# Not `[lints] workspace = true`: the workspace forbids unsafe code, and this crate needs it in one audited function
# (engine::bitmap_sub::read, FFmpeg's subtitle rectangles). The rest of the workspace lint set is the same.
[lints.rust]
future_incompatible = { level = "deny", priority = -1 }
unsafe_code = "deny"

# Optional: frames are stored as `slint::SharedPixelBuffer<Rgba8Pixel>` (no copy into a Vec, and `Image::from_rgba8`
# takes them as they are). Same version as the workspace. Compiles on every platform.
[features]
default = []
slint = ["dep:slint"]

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std"], optional = true }

# Windows only: the rest of the crate compiles everywhere through src/stub.rs. Same versions as rimelight-media and
# rimelight-space. The apps patch ffmpeg-sys-next to the vendored copy (see README.md).
[target.'cfg(windows)'.dependencies]
ffmpeg-next = { version = "9.1", default-features = false, features = ["codec", "format", "software-resampling", "software-scaling"] }
cpal = "0.18"
